[package]
name = "cosmic-settings"
version = "1.12.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
xdgen = "0.1"

[dependencies]

zbus_polkit = { version = "7.0.0", optional = true }
accounts-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings", optional = true }
anyhow = "1.0"
ashpd = { version = "0.14", default-features = false, features = [
    "location",
    "tokio",
], optional = true }
chrono = "0.4"
jiff = "1.0"
clap = { version = "4.6.9", features = ["derive"] }
color-eyre = "0.6.5"
cosmic-bg-config.workspace = true
cosmic-comp-config = { workspace = true, optional = true }
cosmic-config.workspace = true
cosmic-idle-config.workspace = true
cosmic-osk-config = { git = "https://github.com/pop-os/cosmic-osk", features = [
    "subscription",
] }
cosmic-panel-config = { workspace = true, optional = true }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", optional = true }
cosmic-randr-shell.workspace = true
cosmic-randr = { workspace = true, optional = true }
cosmic-settings-config = { git = "https://github.com/pop-os/cosmic-settings-daemon", optional = true }
cosmic-settings-page = { path = "../page" }
cosmic-settings-accessibility-subscription = { path = "../subscriptions/accessibility", optional = true }
cosmic-settings-a11y-manager-subscription = { path = "../subscriptions/a11y-manager", optional = true }
cosmic-settings-airplane-mode-subscription = { path = "../subscriptions/airplane-mode", optional = true }
cosmic-settings-bluetooth-subscription = { path = "../subscriptions/bluetooth", optional = true }
cosmic-settings-sound = { path = "../pages/sound", optional = true }
cosmic-settings-upower-subscription = { path = "../subscriptions/upower", optional = true }
cosmic-settings-wallpaper = { path = "../pages/wallpapers" }
cosmic-settings-daemon-config = { git = "https://github.com/pop-os/cosmic-settings-daemon", optional = true }
cosmic-theme-bundle-config = { path = "../theme-bundle-config" }
derive_setters = "0.1.9"
dirs = "7.0.0"
eyre = "0.6.14"
freedesktop-desktop-entry = "0.8.4"
futures = "0.3.34"
hostname-validator = "1.1.1"
hostname1-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings", optional = true }
i18n-embed-fl = "0.10.1"
image.workspace = true
jxl-image-rs-integration.workspace = true
indexmap = "2.14.2"
itertools = "0.15.0"
itoa = "1.0.19"
libcosmic.workspace = true
iced_winit.workspace = true
locale1-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings", optional = true }
pop-system-updater-zbus = { git = "https://github.com/pop-os/system-updater", optional = true }
sysinfo = { version = "=0.38.0", optional = true }
mime-apps = { package = "cosmic-mime-apps", git = "https://github.com/pop-os/cosmic-mime-apps", features = [
    "tokio",
], optional = true }
notify = "9.0.0"
nmrs = { version = "3.5.13", optional = true }
regex = "1.13.2"
ron = "0.12"
rust-embed = "8.14.0"
sctk = { workspace = true, optional = true }
secure-string = "0.3.0"
secret-service = { version = "6.0.0", features = [
    "crypto-rust",
    "rt-tokio",
], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", optional = true }
slab = "0.4.12"
slotmap = "1.1.1"
static_init = "1.0.4"
sunrise = "3.0.0"
timedate1-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings", optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
udev = { version = "0.9.3", optional = true }
upower-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings", optional = true }
cosmic-bluez-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings", optional = true }
url = "2.5.9"
xkb-data = "0.2.2"
xkeysym = { version = "0.2.1", optional = true }
zbus = { version = "6.5", default-features = false, features = [
    "tokio",
], optional = true }
fontdb.workspace = true
mime = "0.3.18"
rustix = { version = "1.1.6", features = ["process"] }
gettext-rs = { version = "0.8.0", features = [
    "gettext-system",
], optional = true }
num-traits = "0.2"
pwhash = "1"
which = "8.0.6"
intmap = "3.1.3"

[dependencies.cosmic-settings-audio-client]
git = "https://github.com/pop-os/cosmic-settings-daemon"
features = ["codec"]
optional = true

[dependencies.icu]
version = "2.4.0"
features = ["compiled_data"]

[dependencies.i18n-embed]
version = "0.16.0"
features = ["fluent-system", "desktop-requester"]

# Contains region-handling logic for Linux
[dependencies.locales-rs]
git = "https://github.com/AerynOS/locales-rs"
optional = true

[features]
default = ["a11y", "avif", "linux", "single-instance", "wgpu", "systemd"]
avif = ["image/avif-native"]
gettext = ["dep:gettext-rs"]
systemd = []
openrc = []

# Default features for Linux
linux = [
    "cosmic-comp-config",
    "page-accessibility",
    "page-about",
    "page-bluetooth",
    "page-date",
    "page-default-apps",
    "page-display",
    "page-input",
    "page-legacy-applications",
    "page-networking",
    "page-power",
    "page-region",
    "page-sound",
    "page-users",
    "page-window-management",
    "page-workspaces",
    "xdg-portal",
    "wayland",
]

pop-os = ["dep:pop-system-updater-zbus"]

# Pages
page-accessibility = [
    "cosmic-comp-config",
    "dep:sctk",
    "dep:cosmic-protocols",
    "dep:cosmic-settings-config",
    "dep:cosmic-settings-daemon-config",
    "dep:cosmic-settings-accessibility-subscription",
    "dep:cosmic-settings-a11y-manager-subscription",
]
page-about = ["dep:hostname1-zbus", "dep:sysinfo", "dep:zbus"]
page-bluetooth = [
    "dep:cosmic-settings-bluetooth-subscription",
    "dep:zbus",
    "dep:cosmic-bluez-zbus",
]
page-date = ["dep:timedate1-zbus", "dep:zbus"]
page-default-apps = ["dep:cosmic-settings-config", "dep:mime-apps"]
page-display = ["dep:serde_json", "dep:udev", "dep:zbus"]
page-input = [
    "cosmic-comp-config",
    "gettext",
    "dep:cosmic-settings-config",
    "dep:udev",
    "dep:xkeysym",
    "wayland",
]
page-legacy-applications = ["cosmic-comp-config", "dep:cosmic-randr"]
page-networking = ["xdg-portal", "dep:nmrs", "dep:secret-service", "dep:zbus"]
page-power = ["dep:upower-zbus", "dep:zbus"]
page-region = [
    "gettext",
    "dep:locales-rs",
    "dep:locale1-zbus",
    "dep:zbus",
    "dep:accounts-zbus",
]
page-sound = ["dep:cosmic-settings-audio-client", "dep:cosmic-settings-sound"]
page-users = ["xdg-portal", "dep:accounts-zbus", "dep:zbus", "dep:zbus_polkit"]
page-window-management = ["cosmic-comp-config", "dep:cosmic-settings-config"]
page-workspaces = ["cosmic-comp-config"]

# Other features
a11y = ["libcosmic/a11y"]
ashpd = ["dep:ashpd"]
cosmic-comp-config = ["dep:cosmic-comp-config"]
dbus-config = ["libcosmic/dbus-config", "cosmic-config/dbus"]
single-instance = ["libcosmic/single-instance"]
test = []
wayland = [
    "libcosmic/wayland",
    "dep:cosmic-panel-config",
    "dep:cosmic-randr",
    "iced_winit/wayland",
]
wgpu = ["libcosmic/wgpu"]
xdg-portal = ["ashpd", "libcosmic/xdg-portal"]
